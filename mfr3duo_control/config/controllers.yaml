controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    tmr_controller:
      type: mfr3duo_control/TmrController
    left_gripper_controller:
      type: mfr3duo_control/Mfr3DuoGripperController
    right_gripper_controller:
      type: mfr3duo_control/Mfr3DuoGripperController
    spine_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints: [left_fr3v2_1_joint1, left_fr3v2_1_joint2, left_fr3v2_1_joint3,
             left_fr3v2_1_joint4, left_fr3v2_1_joint5, left_fr3v2_1_joint6,
             left_fr3v2_1_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_arm_controller:
  ros__parameters:
    joints: [right_fr3v2_1_joint1, right_fr3v2_1_joint2, right_fr3v2_1_joint3,
             right_fr3v2_1_joint4, right_fr3v2_1_joint5, right_fr3v2_1_joint6,
             right_fr3v2_1_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

spine_controller:
  ros__parameters:
    joints: [franka_spine_vertical_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      franka_spine_vertical_joint: {trajectory: 0.02, goal: 0.003}

tmr_controller:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_odom: true
    publish_tf: true
    odom_publish_rate: 50.0
    diagnostic_publish_rate: 1.0
    odometry:
      maximum_condition: 1000000.0
      maximum_timestamp_gap: 0.5
      maximum_encoder_delta: 0.25
      steering_interval: 0.1
      residual_ratio: 0.2
    command_timeout: 0.5
    wheel_radius: 0.05
    steering_slow_threshold: 0.1
    steering_stop_threshold: 0.6
    max_steering_rate: 1.5
    max_wheel_velocity: 8.0
    max_linear_velocity: 0.3
    max_angular_velocity: 0.5
    linear_acceleration: 0.5
    angular_acceleration: 0.5
    modules:
      module_0:
        steering_joint: tmrv0_2_joint_0
        drive_joint: tmrv0_2_joint_1
        x: 0.3
        y: -0.2
        steering_offset: 0.0
        steering_sign: 1.0
        drive_sign: 1.0
      module_1:
        steering_joint: tmrv0_2_joint_2
        drive_joint: tmrv0_2_joint_3
        x: -0.3
        y: 0.2
        steering_offset: 0.0
        steering_sign: 1.0
        drive_sign: 1.0

imu_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_imu_sensor_frame

left_gripper_controller:
  ros__parameters:
    gpio: left_gripper
    default_velocity: 0.05
    default_effort: 20.0
    min_position: 0.0
    max_position: 0.04
    goal_tolerance: 0.001
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5
    allow_stalling: true
    cancel_hold_effort: 10.0

right_gripper_controller:
  ros__parameters:
    gpio: right_gripper
    default_velocity: 0.05
    default_effort: 20.0
    min_position: 0.0
    max_position: 0.04
    goal_tolerance: 0.001
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5
    allow_stalling: true
    cancel_hold_effort: 10.0


joint_state_broadcaster:
  ros__parameters:
    joints:
    - left_fr3v2_1_joint1
    - left_fr3v2_1_joint2
    - left_fr3v2_1_joint3
    - left_fr3v2_1_joint4
    - left_fr3v2_1_joint5
    - left_fr3v2_1_joint6
    - left_fr3v2_1_joint7
    - right_fr3v2_1_joint1
    - right_fr3v2_1_joint2
    - right_fr3v2_1_joint3
    - right_fr3v2_1_joint4
    - right_fr3v2_1_joint5
    - right_fr3v2_1_joint6
    - right_fr3v2_1_joint7
    - franka_spine_vertical_joint
    - tmrv0_2_joint_0
    - tmrv0_2_joint_1
    - tmrv0_2_joint_2
    - tmrv0_2_joint_3
    - left_fr3v2_1_finger_joint1
    - right_fr3v2_1_finger_joint1
    interfaces:
    - position
    - velocity
