planning_plugin: ompl_interface/OMPLPlanner
request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.01
# Keep short corrections below the facade's 0.0001 joint goal tolerance.
min_angle_change: 0.000001
path_tolerance: 0.001
planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0
left_arm:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
right_arm:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
spine:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
left_arm_spine:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
right_arm_spine:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
dual_arm:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
dual_arm_spine:
  planner_configs:
  - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.005
